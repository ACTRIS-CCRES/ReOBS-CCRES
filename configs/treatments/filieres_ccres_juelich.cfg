[construct_final_mwr]
processing_name="Construct the final MWR ReOBS file"
processing_code=${ccres_juelich:code_dir}/core/concatenate.py
config_file = ${ccres_juelich:conf_site_dir}/construct_final_mwr.cfg
input01 = $[base_cloudnet_mwr_single_reobs]
input02 = $[base_cloudnet_mwr_single_ah_reobs]
input03 = $[base_cloudnet_concat_mwr_l1c_reobs]
input04 = $[base_cloudnet_mwr_multi_reobs]
output=$[base_final_mwr_reobs]

[construct_final_2D]
processing_name="Construct the final 2D ReOBS file"
processing_code=${ccres_juelich:code_dir}/core/concatenate.py
config_file = ${ccres_juelich:conf_site_dir}/construct_final_2D.cfg
input01 = $[base_cloudnet_categorize_reobs]
input02 = $[base_cloudnet_classification_reobs]
input03 = $[base_cloudnet_drizzle_reobs]
input04 = $[base_cloudnet_iwc_reobs]
input05 = $[base_cloudnet_lidar_reobs]
input06 = $[base_cloudnet_lwc_reobs]
input07 = $[base_cloudnet_mwr_single_reobs]
input08 = $[base_cloudnet_mwr_single_ah_reobs]
input09 = $[base_cloudnet_concat_mwr_l1c_reobs]
input10 = $[base_cloudnet_mwr_multi_reobs]
input11 = $[base_cloudnet_radar_reobs]
input12 = $[base_cloudnet_disdrometer_reobs]
input13 = $[base_cloudnet_disdrometer_raw_reobs]
output=$[base_final_2D_reobs]