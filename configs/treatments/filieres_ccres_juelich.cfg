output=$[base_cloudnet_mwr_l1c_joyhat_reobs]
time_division = "15 days"

[concat_mwr_l1c]
accept=input_not_available
processing_name="Concatenation avec priorite : mwr l1c"
processing_code=${ccres_juelich:code_dir}/core/prioritize.py
config_file = ${ccres_juelich:conf_site_dir}/priorities/mwr_l1c.cfg
input1 = $[base_cloudnet_mwr_l1c_tophat_reobs]
input2 = $[base_cloudnet_mwr_l1c_joyhat_reobs]
output=$[base_cloudnet_concat_mwr_l1c_reobs]

[cloudnet_mwr_single]
processing_name="Lecture des fichiers cloudnet mwr_single"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/mwr_single.cfg
