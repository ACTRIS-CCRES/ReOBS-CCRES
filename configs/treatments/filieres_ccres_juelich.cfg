#include "bases_ccres_juelich.cfg"

[DEFAULT]
time_division = none
merge_inputs = none
config_file = none
default_config_file = ${ccres_juelich:conf_site_dir}/default.cfg

; CLOUDNET
[cloudnet_categorize]
processing_name="Lecture des fichiers cloudnet categorize"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/categorize.cfg
input=$[base_cloudnet_categorize]
output=$[base_cloudnet_categorize_reobs]
time_division = "15 days"

[cloudnet_classification]
processing_name="Lecture des fichiers cloudnet classification"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/classification.cfg
input=$[base_cloudnet_classification]
output=$[base_cloudnet_classification_reobs]
time_division = "15 days"

[cloudnet_drizzle]
