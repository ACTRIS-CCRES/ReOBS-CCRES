output=$[base_cloudnet_mwr_single_ah_reobs]
time_division = "15 days"

[cloudnet_radar]
processing_name="Lecture des fichiers cloudnet radar"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/radar.cfg
input01=$[base_cloudnet_radar]
input02=$[base_cloudnet_radar_0366fa69]
input03=$[base_cloudnet_radar_35_0366fa69]
merge_inputs="input01 input02 input03"
output=$[base_cloudnet_radar_reobs]
time_division = "15 days"

[cloudnet_disdrometer]
processing_name="Lecture des fichiers cloudnet disdrometer"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/disdrometer.cfg
input01=$[base_cloudnet_disdrometer]
input02=$[base_cloudnet_disdrometer_2a1ca46e]
merge_inputs="input01 input02"
