; ---------------------------------------
; MWR L1C
[cloudnet_mwr_l1c_tophat]
processing_name="Lecture des fichiers cloudnet mwr_l1c TOPHAT"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/mwr_l1c.cfg
input01=$[base_cloudnet_mwr_l1c]
input02=$[base_cloudnet_mwr_l1c_1668271e]
