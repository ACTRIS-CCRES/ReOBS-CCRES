config_file = ${ccres_juelich:conf_site_dir}/disdrometer_raw.cfg
input01=$[base_cloudnet_disdrometer]
input02=$[base_cloudnet_disdrometer_2a1ca46e]
merge_inputs="input01 input02"
output=$[base_cloudnet_disdrometer_raw_reobs]
time_division = "15 days"

[construct_final_mwr]
processing_name="Construct the final MWR ReOBS file"
processing_code=${ccres_juelich:code_dir}/core/concatenate.py
config_file = ${ccres_juelich:conf_site_dir}/construct_final_mwr.cfg
input01 = $[base_cloudnet_mwr_single_reobs]
input02 = $[base_cloudnet_mwr_single_ah_reobs]
input03 = $[base_cloudnet_concat_mwr_l1c_reobs]
input04 = $[base_cloudnet_mwr_multi_reobs]
output=$[base_final_mwr_reobs]

[cloudnet_meteo]
processing_name="Lecture des fichiers cloudnet meteo"
processing_code=${ccres_juelich:code_dir}/core/data_stream.py
config_file = ${ccres_juelich:conf_site_dir}/meteo.cfg
input=$[base_cloudnet_meteo_726b3b29]
output=$[base_cloudnet_meteo_reobs]
time_division = "15 days"

[cloudnet_raingauge]
processing_name="Lecture des fichiers cloudnet raingauge"
