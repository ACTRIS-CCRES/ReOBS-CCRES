config_file = ${ccres_juelich:conf_site_dir}/raingauge.cfg
input=$[base_cloudnet_raingauge_49ca09de]
output=$[base_cloudnet_raingauge_reobs]
time_division = "15 days"

[construct_final_2D]
accept = input_not_available,data_not_available
processing_name = "Construct the final 2D ReOBS file"
processing_code = ${ccres_juelich:code_dir}/core/concatenate.py
config_file = ${ccres_juelich:conf_site_dir}/construct_final_2D.cfg
input01 = $[base_cloudnet_categorize_reobs]
input02 = $[base_cloudnet_classification_reobs]
input03 = $[base_cloudnet_der_reobs]
input04 = $[base_cloudnet_disdrometer_raw_reobs]
input05 = $[base_cloudnet_disdrometer_reobs]
input06 = $[base_cloudnet_drizzle_reobs]
input07 = $[base_cloudnet_ier_reobs]
input08 = $[base_cloudnet_iwc_reobs]
input09 = $[base_cloudnet_lidar_reobs]
input10 = $[base_cloudnet_doppler_lidar_wind_reobs]
input11 = $[base_cloudnet_lwc_reobs]
input12 = $[base_cloudnet_meteo_reobs]
input13 = $[base_cloudnet_raingauge_reobs]
input14 = $[base_cloudnet_concat_mwr_l1c_reobs]
input15 = $[base_cloudnet_mwr_single_ah_reobs]
input16 = $[base_cloudnet_mwr_single_reobs]
input17 = $[base_cloudnet_mwr_multi_reobs]
input18 = $[base_cloudnet_radar_reobs]
output = $[base_final_2D_reobs]
