#include "bases_ccres_limassol.cfg"

[DEFAULT]
time_division = none
merge_inputs = none
config_file = none
default_config_file = ${ccres_limassol:conf_site_dir}/default.cfg

; CLOUDNET
[cloudnet_categorize]
processing_name="Lecture des fichiers cloudnet categorize"
