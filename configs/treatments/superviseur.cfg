#include "macro.cfg"

[repertoire]
#ifdef REP_SUP
rep_superviseur=REP_SUP
#else
rep_superviseur=$(dirname $(readlink -f $0))
#endif

rep_tmp=/scratchx/$USER/reobs_prod/superviseur/tmp
rep_log=/homedata/$USER/reobs_prod/superviseur/logs
rep_etc=/homedata/$USER/reobs_prod/superviseur/etc
rep_outils=${rep_superviseur}

[reobs]
home_dir=/home/reobs/ccres/ReOBS-CCRES
sites_list=(ccres_palaiseau ccres_juelich ccres_bucharest ccres_lindenberg ccres_galati ccres_hyytiala)

[ccres_palaiseau]
site_id=_CCRES_PALAISEAU_
code_dir=${reobs:home_dir}/
first_date=20230401
liste_filieres = (concat_mwr_l1c concat_mwr_multi concat_mwr_single concat_mwr_single_ah cloudnet_categorize cloudnet_classification cloudnet_drizzle cloudnet_iwc cloudnet_lwc cloudnet_lidar cloudnet_mwr_multi cloudnet_mwr_l1c cloudnet_mwr_single cloudnet_mwr_single_ah cloudnet_radar cloudnet_disdrometer cloudnet_disdrometer_raw cloudnet_meteo construct_final_2D)
file_version = v0_1_0
folder_version = v0_1_0
conf_site_dir = /home/reobs/ReOBS-CCRES/configs/treatments/sites/ccres_palaiseau/
reobs_dir = /bdd/REOBS/base/ccres_palaiseau/products/${ccres_palaiseau:folder_version}
reobs_dir_treatments = /bdd/REOBS/base/ccres_palaiseau/products/${ccres_palaiseau:folder_version}/treatments

