#include "macro.cfg"

[repertoire]
#ifdef REP_SUP
rep_superviseur=REP_SUP
#else
rep_superviseur=$(dirname $(readlink -f $0))
#endif

rep_tmp=/scratchx/$USER/reobs_prod/superviseur/tmp
rep_log=/homedata/$USER/reobs_prod/superviseur/logs
rep_etc=/homedata/$USER/reobs_prod/superviseur/etc
rep_outils=${rep_superviseur}

[reobs]
home_dir=/home/reobs/ReOBS-CCRES
sites_list=(ccres_bucharest ccres_cabauw ccres_cluj ccres_galati ccres_granada ccres_hyytiala ccres_juelich ccres_lampedusa ccres_limassol ccres_lindenberg ccres_maido ccres_mindelo ccres_munich ccres_palaiseau ccres_payerne ccres_potenza)

