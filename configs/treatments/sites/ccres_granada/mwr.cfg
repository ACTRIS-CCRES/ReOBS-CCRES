[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = lwp

[check]
checked_var_minmax = lwp
min_abs = 0
max_abs = 2000

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {lwp}_mean
var_median = {lwp}_median
var_sum = {lwp}_sum
var_std = {lwp}_std
var_min = {lwp}_min
var_max = {lwp}_max
var_nb = {lwp}_nb
var_q25 = {lwp}_q25
var_q75 = {lwp}_q75
;valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {lwp}_mean
new_var_name = lwp
nc_format = ${params:nc_format}
var_name = lwp,{lwp}_median,{lwp}_sum,{lwp}_std,{lwp}_min,{lwp}_max,{lwp}_nb,{lwp}_q25,{lwp}_q75

