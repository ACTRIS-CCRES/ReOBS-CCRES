[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = absolute_humidity,absolute_humidity_quality_flag
original_dim_name = height
new_dim_name = altitude
original_var_name = absolute_humidity,absolute_humidity_quality_flag
new_var_name = ah_mwr,ah_flag

[check_1]
checked_var_flags = ah_mwr
flags = ah_flag
flags_to_keep = (0)

[check_2]
checked_var_minmax = ah_mwr
min_abs = 0
max_abs = 0.05

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {ah_mwr}_mean
var_median = {ah_mwr}_median
var_sum = {ah_mwr}_sum
var_std = {ah_mwr}_std
var_min = {ah_mwr}_min
var_max = {ah_mwr}_max
var_nb = {ah_mwr}_nb
var_q25 = {ah_mwr}_q25
var_q75 = {ah_mwr}_q75
;valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {ah_mwr}_mean
new_var_name = ah_mwr
nc_format = ${params:nc_format}
var_name = ah_mwr,{ah_mwr}_median,{ah_mwr}_sum,{ah_mwr}_std,{ah_mwr}_min,{ah_mwr}_max,{ah_mwr}_nb,{ah_mwr}_q25,{ah_mwr}_q75

[attrs]
title = REOBS/ CLOUDNET MWR single dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
acknowledgement =
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
