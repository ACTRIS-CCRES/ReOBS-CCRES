[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[ah_mwr]
long_name = Absolute humidity
units = kg m-3
comment = neural network - RPG retrieval
ancillary_variables = ah_mwr_median, ah_mwr_std, ah_mwr_min, ah_mwr_max, ah_mwr_sum, ah_mwr_nb, ah_mwr_q25, ah_mwr_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=
