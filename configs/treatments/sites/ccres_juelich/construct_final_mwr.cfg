
[DEFAULT]
dim_time = time

; MWR Single
[input01]
var_to_keep = lwp_mwr,iwv_mwr,{lwp_mwr,iwv_mwr}_median,{lwp_mwr,iwv_mwr}_sum,{lwp_mwr,iwv_mwr}_std,{lwp_mwr,iwv_mwr}_min,{lwp_mwr,iwv_mwr}_max,{lwp_mwr,iwv_mwr}_nb,{lwp_mwr,iwv_mwr}_q25,{lwp_mwr,iwv_mwr}_q75

; MWR Single AH
[input02]
var_to_keep =  ah_mwr,{ah_mwr}_median,{ah_mwr}_sum,{ah_mwr}_std,{ah_mwr}_min,{ah_mwr}_max,{ah_mwr}_nb,{ah_mwr}_q25,{ah_mwr}_q75

; MWR L1C
[input03]
var_to_keep =  tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_median,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_sum,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_std,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_min,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_max,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_nb,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q25,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q75

; MWR MULTI
[input04]
var_to_keep = ta_mwr,rh_mwr,theta_mwr,theta_e_mwr,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_median,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_sum,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_std,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_min,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_max,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_nb,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q25,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q75


