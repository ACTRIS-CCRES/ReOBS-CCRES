[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = lwp,lwp_quality_flag,iwv,iwv_quality_flag
original_dim_name = time
new_dim_name = time
original_var_name = lwp,lwp_quality_flag,iwv,iwv_quality_flag
new_var_name = lwp_mwr,lwp_flag,iwv_mwr

[check_1]
checked_var_flags = lwp_mwr,iwv_mwr
flags = lwp_flag,iwv_quality_flag
flags_to_keep = (0),(0)

[check_2]
checked_var_minmax = lwp_mwr,iwv_mwr
min_abs = -20,0
max_abs = 2000,70

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = (${params:time_resolution})
var_computation_offset = (${params:time_offset})
var_computation_how = ${params:time_how}
var_mean = {lwp_mwr,iwv_mwr}_mean
var_median = {lwp_mwr,iwv_mwr}_median
var_sum = {lwp_mwr,iwv_mwr}_sum
var_std = {lwp_mwr,iwv_mwr}_std
var_min = {lwp_mwr,iwv_mwr}_min
var_max = {lwp_mwr,iwv_mwr}_max
var_nb = {lwp_mwr,iwv_mwr}_nb
var_q25 = {lwp_mwr,iwv_mwr}_q25
var_q75 = {lwp_mwr,iwv_mwr}_q75
# valid_percent = 0.5

[write]
order_of_dimensions = time
original_var_name = {lwp_mwr,iwv_mwr}_mean
new_var_name = lwp_mwr,iwv_mwr
nc_format = ${params:nc_format}
var_name = lwp_mwr,iwv_mwr,{lwp_mwr,iwv_mwr}_median,{lwp_mwr,iwv_mwr}_sum,{lwp_mwr,iwv_mwr}_std,{lwp_mwr,iwv_mwr}_min,{lwp_mwr,iwv_mwr}_max,{lwp_mwr,iwv_mwr}_nb,{lwp_mwr,iwv_mwr}_q25,{lwp_mwr,iwv_mwr}_q75

