[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = Zh,v,radar_frequency,nyquist_velocity
original_dim_name = time,range
new_dim_name = time,altitude

[convert]
var_to_expand = radar_frequency,nyquist_velocity
expand_along = (time),(time)

[check]
checked_var_minmax = Zh,v
min_abs = -50,-10
max_abs = 30,10

[convert_1]
dbz_to_z_var = Zh

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {Zh,v,radar_frequency,nyquist_velocity}_mean
var_median = {Zh,v,radar_frequency,nyquist_velocity}_median
var_sum = {Zh,v,radar_frequency,nyquist_velocity}_sum
var_std = {Zh,v,radar_frequency,nyquist_velocity}_std
var_min = {Zh,v,radar_frequency,nyquist_velocity}_min
var_max = {Zh,v,radar_frequency,nyquist_velocity}_max
var_nb = {Zh,v,radar_frequency,nyquist_velocity}_nb
var_q25 = {Zh,v,radar_frequency,nyquist_velocity}_q25
var_q75 = {Zh,v,radar_frequency,nyquist_velocity}_q75
valid_percent = 0.0

[convert_2]
z_to_dbz_var = Zh_mean,Zh_median,Zh_sum,Zh_std,Zh_min,Zh_max,Zh_nb,Zh_q25,Zh_q75

[write]
order_of_dimensions = time,altitude
original_var_name = {Zh,v,radar_frequency,nyquist_velocity}_mean
new_var_name = Zh,v,radar_frequency,nyquist_velocity
nc_format = ${params:nc_format}
var_name = Zh,v,radar_frequency,nyquist_velocity,{Zh,v,radar_frequency,nyquist_velocity}_median,{Zh,v,radar_frequency,nyquist_velocity}_sum,{Zh,v,radar_frequency,nyquist_velocity}_std,{Zh,v,radar_frequency,nyquist_velocity}_min,{Zh,v,radar_frequency,nyquist_velocity}_max,{Zh,v,radar_frequency,nyquist_velocity}_nb,{Zh,v,radar_frequency,nyquist_velocity}_q25,{Zh,v,radar_frequency,nyquist_velocity}_q75

