[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = wind_speed,wind_direction,air_temperature,relative_humidity,air_pressure,rainfall_rate
original_var_name = wind_speed,wind_direction,air_temperature,relative_humidity,air_pressure,rainfall_rate
new_var_name = ws,wd,ta,hur,ps,pr
original_dim_name = time
new_dim_name = time

[convert]
var_to_convert = ta,hur,ps,pr
operation = -273.15,*100,/100,60*1000

[check]
checked_var_minmax = ws,wd,ta,hur,ps,pr
min_abs = 0,0,-30,3,960,0
max_abs = 40,360,50,103,1030,5
checked_var_min_std = ta,hur,ps
min_std_window = 60,60,60
min_std = 0,0,0
min_std_nb_sigma = 1,1,1
checked_var_max_std = ws,ta,hur,ps
QC3_window = 15,15,15,15
QC3_alpha = 0.3,0.25,1.2,0.15
QC3_gamma = 1.8,0.2,1.1,0.12
QC3_beta = 10,10,10,10

[add]
var_uv = ua,va
var_uv_needed = ws,wd
var_Sa_Ca = Sa,Ca
var_Sa_Ca_needed = wd
var_psl = psl
var_psl_needed = ta,ps
var_huss = huss
var_huss_needed = hur,psl,ta,ps

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = ${params:time_resolution}
var_computation_offset = ${params:time_offset}
var_computation_how = ${params:time_how}
var_mean = {ws,ta,hur,ps,ua,va,psl,huss,Sa,Ca}_mean
var_median = {ws,ta,hur,ps,ua,va,psl,huss,Sa,Ca}_median
var_sum = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_sum
var_std = {ws,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_std
var_min = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_min
var_max = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_max
var_nb = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_nb
var_q25 = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_q25
var_q75 = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_q75
valid_percent = 0.5

[add_1]
var_wd_mean = wd_mean
var_wd_mean_needed = ua_mean,va_mean
var_wd_std = wd_std
var_wd_std_needed = Sa_mean,Ca_mean

[write]
order_of_dimensions=time
original_var_name = {ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca}_mean,{pr}_sum
new_var_name = ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr
nc_format = ${params:nc_format}
var_name = ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr,{ws,ta,hur,ps,ua,va,psl,huss,Sa,Ca}_median,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca}_sum,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_std,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_min,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_max,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_nb,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_q25,{ws,wd,ta,hur,ps,ua,va,psl,huss,Sa,Ca,pr}_q75

[attrs]
title = ReOBS-CCRES meteo dataset
summary = The 20-year-long SIRTA-ReOBS dataset is contained in a single netCDF file containing mean values of more than 150 physical variables. Variables entering the ReOBS dataset are quality controlled at their native time resolution. The objective of ReObs is also to respect the FAIR principles (Findable, Accessible, Interoperable, Reusable) in particular the Reusable aspect which is more obvious for a production chain.
keywords = GCMD: ATMOSPHERE,GCMD: AEROSOLS,GCMD: AIR QUALITY,GCMD: ATMOSPHERIC PRESSURE,GCMD:  LAND SURFACE/AGRICULTURE INDICATORS,GCMD: ATMOSPHERIC RADIATION,GCMD: ATMOSPHERIC TEMPERATURE,GCMD: ATMOSPHERIC WATER VAPOR,GCMD: ATMOSPHERIC WINDS,GCMD: CLOUDS,GCMD: PRECIPITATION,GCMD: DATA ANALYSIS AND VISUALIZATION,GCMD: CALIBRATION/VALIDATION,GCMD: DATA ANALYSIS,GCMD: STATISTICAL APPLICATIONS
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR,SIRTA,Meteo-France
comment = Technical and scientific staff of SIRTA site discuss with AERIS data center staff to develop the quality check and provide the metadata information concerning variables and instruments.
acknowledgement = The ReOBS database is maintained by the French national center for Atmospheric data and services AERIS. We extend our acknowledgments to the technical and computer staff of SIRTA Observatory for taking the observations and making the data set easily accessible.We also thanks the ACTRIS-FR Research Infrastructure for their support in this study.
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,SIRTA,REOBS,Meteo-France
contributor_role = AERIS is the data center, SIRTA is the observatory where all the instruments are installed, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
