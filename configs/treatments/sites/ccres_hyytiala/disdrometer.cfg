ancillary_variables = pr_dd_median, pr_dd_std, pr_dd_min, pr_dd_max, pr_dd_sum, pr_dd_nb, pr_dd_q25, pr_dd_q75
cell_methods = time:mean
dtype = float32
theme = surface_meteorology

[zh_dd]
long_name = Equivalent radar reflectivity factor
units = dBZ
comment = 
ancillary_variables = zh_dd_median, zh_dd_std, zh_dd_min, zh_dd_max, zh_dd_sum, zh_dd_nb, zh_dd_q25, zh_dd_q75
