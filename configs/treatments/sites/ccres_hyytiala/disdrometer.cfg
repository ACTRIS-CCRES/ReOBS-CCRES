[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = rainfall_rate,radar_reflectivity,n_particles,state_sensor,V_power_supply,sig_laser
original_var_name = rainfall_rate,radar_reflectivity,n_particles
new_var_name = pr_dd,zh_dd,n_dd
original_dim_name = time
new_dim_name = time

[convert]
var_to_convert = pr_dd
operation = *3600*1000

[check]
checked_var_flags = pr_dd,zh_dd,n_dd
flags = state_sensor
flags_to_keep = (0)
checked_var_technical = pr_dd,zh_dd,n_dd
technical_vars = V_power_supply,sig_laser
technical_min = 10,1e4
technical_max = 28,1e6

[convert_1]
dbz_to_z_var = zh_dd

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = ${params:time_resolution}
var_computation_offset = ${params:time_offset}
var_computation_how = ${params:time_how}
var_mean = {pr_dd,zh_dd,n_dd}_mean
var_median = {pr_dd,zh_dd,n_dd}_median
var_sum = {pr_dd,zh_dd,n_dd}_sum
var_std = {pr_dd,zh_dd,n_dd}_std
var_min = {pr_dd,zh_dd,n_dd}_min
var_max = {pr_dd,zh_dd,n_dd}_max
var_nb = {pr_dd,zh_dd,n_dd}_nb
var_q25 = {pr_dd,zh_dd,n_dd}_q25
var_q75 = {pr_dd,zh_dd,n_dd}_q75
# valid_percent = 0.5

[convert_2]
z_to_dbz_var = zh_dd_mean,zh_dd_median,zh_dd_sum,zh_dd_std,zh_dd_min,zh_dd_max,zh_dd_nb,zh_dd_q25,zh_dd_q75

[write]
order_of_dimensions = time
original_var_name = {pr_dd,zh_dd,n_dd}_mean
new_var_name = pr_dd,zh_dd,n_dd
nc_format = ${params:nc_format}
var_name = pr_dd,zh_dd,n_dd,{pr_dd,zh_dd,n_dd}_median,{pr_dd,zh_dd,n_dd}_sum,{pr_dd,zh_dd,n_dd}_std,{pr_dd,zh_dd,n_dd}_min,{pr_dd,zh_dd,n_dd}_max,{pr_dd,zh_dd,n_dd}_nb,{pr_dd,zh_dd,n_dd}_q25,{pr_dd,zh_dd,n_dd}_q75

