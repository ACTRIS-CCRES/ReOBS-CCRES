[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = category_bits,quality_bits
original_dim_name = time,height
new_dim_name = time,altitude
original_var_name = category_bits,quality_bits
new_var_name = target_cat,target_quality

[check_1]
checked_var_flags = target_cat
flags = target_quality
flags_to_keep = (0,1)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {target_cat,target_quality}_mean
var_median = {target_cat,target_quality}_median
var_sum = {target_cat,target_quality}_sum
var_std = {target_cat,target_quality}_std
var_min = {target_cat,target_quality}_min
var_max = {target_cat,target_quality}_max
var_nb = {target_cat,target_quality}_nb
var_q25 = {target_cat,target_quality}_q25
var_q75 = {target_cat,target_quality}_q75
var_most_frequent = {target_cat,target_quality}_most_frequent
var_most_frequent_percent = {target_cat,target_quality}_most_frequent_percent
var_second_most_frequent = {target_cat,target_quality}_second_most_frequent
var_second_most_frequent_percent = {target_cat,target_quality}_second_most_frequent_percent
valid_percent = 0.0

[write]
order_of_dimensions = time,altitude
original_var_name = {target_cat,target_quality}_mean
new_var_name = target_cat,target_quality
nc_format = ${params:nc_format}
var_name = target_cat,target_quality,{target_cat,target_quality}_median,{target_cat,target_quality}_sum,{target_cat,target_quality}_std,{target_cat,target_quality}_min,{target_cat,target_quality}_max,{target_cat,target_quality}_nb,{target_cat,target_quality}_q25,{target_cat,target_quality}_q75,{target_cat,target_quality}_most_frequent,{target_cat,target_quality}_most_frequent_percent,{target_cat,target_quality}_second_most_frequent,{target_cat,target_quality}_second_most_frequent_percent

[attrs]
title = REOBS/ CLOUDNET CATEGORIZE dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
acknowledgement =
