standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
