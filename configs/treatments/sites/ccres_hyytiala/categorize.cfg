contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[target_cat]
long_name = Target categorization
units = 1
comment = This variable contains information on the nature of the targets at each pixel, thereby facilitating the application of algorithms that work with only one type of target. The information is in the form of an array of bits, each of which states either whether a certain type of particle is present (e.g. aerosols), or the whether some of the target particles have a particular property. The definitions of each bit are given in the definition attribute. Bit 0 is the least significant.\nBit 0: Small liquid droplets are present.\nBit 1: Falling hydrometeors are present if Bit 2 is set then these are most likely ice particles, otherwise they are drizzle or rain drops.\nBit 2: Wet-bulb temperature is less than 0 degrees C, implying the phase of Bit-1 particles.\nBit 3: Melting ice particles are present.\nBit 4: Aerosol particles are present and visible to the lidar.\nBit 5: Insects are present and visible to the radar.
ancillary_variables = target_cat_median, target_cat_std, target_cat_min, target_cat_max, target_cat_sum, target_cat_nb, target_cat_q25, target_cat_q75
cell_methods= time:mean, altitude:mean
dtype = int32
theme=clouds

[target_quality]
long_name = Quality bits
units = 1
comment =This variable contains information on the quality of the data at each pixel. The information is in the form of an array of bits, and the definitions of each bit are given in the definition attribute. Bit 0 is the least significant.\nBit 0: An echo is detected by the radar.\nBit 1: An echo is detected by the lidar.\nBit 2: The apparent echo detected by the radar is ground clutter or some other non-atmospheric artifact.\nBit 3: The lidar echo is due to clear-air molecular scattering.\nBit 4: Liquid water cloud, rainfall or melting ice below this pixel will have caused radar and lidar attenuation if bit 5 is set then        a correction for the radar attenuation has been performed      otherwise do not trust the absolute values of reflectivity factor. No correction is performed for lidar attenuation.\nBit 5: Radar reflectivity has been corrected for liquid-water attenuation using the microwave radiometer measurements of liquid water path and the lidar estimation of the location of liquid water cloud be aware that errors in reflectivity may result.
ancillary_variables = target_quality_median, target_quality_std, target_quality_min, target_quality_max, target_quality_sum, target_quality_nb, target_quality_q25, target_quality_q75
cell_methods= time:mean, altitude:mean
dtype = int32
theme=clouds
