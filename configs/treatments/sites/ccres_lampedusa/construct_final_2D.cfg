[DEFAULT]
dim_time = time

; cloudnet_categorize
[input01]
var_to_keep = {target_cat_cl}_most_frequent,{target_cat_cl}_most_frequent_percent,{target_cat_cl}_second_most_frequent,{target_cat_cl}_second_most_frequent_percent

; cloudnet_classification
[input02]
var_to_keep = {target_class_cl}_most_frequent,{target_class_cl}_most_frequent_percent,{target_class_cl}_second_most_frequent,{target_class_cl}_second_most_frequent_percent,cbh_cl,cth_cl,{cbh_cl,cth_cl}_median,{cbh_cl,cth_cl}_min,{cbh_cl,cth_cl}_max,{cbh_cl,cth_cl}_q25,{cbh_cl,cth_cl}_q75,{cbh_cl,cth_cl}_nb

; cloudnet_der
[input03]
var_to_keep = n_scaled,der,der_error,{n_scaled,der,der_error}_std,{n_scaled,der,der_error}_nb,{der_retrieval_status}_most_frequent,{der_retrieval_status}_second_most_frequent,{der_retrieval_status}_most_frequent_percent,{der_retrieval_status}_second_most_frequent_percent

; cloudnet_disdrometer_raw
[input04]
var_to_keep = raw_dd,{raw_dd}_std,{raw_dd}_nb

; cloudnet_disdrometer
[input05]
var_to_keep = pr_dd,zh_dd,{pr_dd,zh_dd}_std,{pr_dd,zh_dd}_nb

; cloudnet_drizzle
[input06]
var_to_keep =  Do_cl,mu_cl,drizzle_N_cl,drizzle_lwc_cl,v_drizzle_cl,v_air_cl,{Do_cl,mu_cl,drizzle_N_cl,drizzle_lwc_cl,v_drizzle_cl,v_air_cl}_std,{Do_cl,mu_cl,drizzle_N_cl,drizzle_lwc_cl,v_drizzle_cl,v_air_cl}_nb

; cloudnet_ier
[input07]
var_to_keep = ier,ier_error,{ier,ier_error}_std,{ier,ier_error}_nb,{ier_retrieval_status}_most_frequent,{ier_retrieval_status}_second_most_frequent,{ier_retrieval_status}_most_frequent_percent,{ier_retrieval_status}_second_most_frequent_percent 

; cloudnet_iwc
[input08]
var_to_keep =  iwc_cl,{iwc_cl}_std,{iwc_cl}_nb

; cloudnet_lidar
[input09]
var_to_keep  = bck_smooth_alc,{bck_smooth_alc}_q25,{bck_smooth_alc}_q75,{bck_smooth_alc}_nb

; cloudnet_lwc
[input10]
var_to_keep =  lwc_cl,{lwc_cl}_std,{lwc_cl}_nb

; cloudnet_meteo
[input11]
var_to_keep = ws_ws,wd_ws,ta_ws,rh_ws,press_ws,psl_ws,huss_ws,pr_ws,ra_ws,{ws_ws,wd_ws,ta_ws,rh_ws,pr_ws,press_ws,psl_ws,huss_ws}_std,{ws_ws,wd_ws,ta_ws,rh_ws,press_ws,psl_ws,huss_ws}_nb,{pr_ws,ra_ws}_min,{pr_ws,ra_ws}_max

; MWR L1C
[input12]
var_to_keep = tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_std,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_nb

; MWR Single AH
[input13]
var_to_keep = ah_mwr,{ah_mwr}_std,{ah_mwr}_nb

; MWR Single
[input14]
var_to_keep = lwp_mwr,iwv_mwr,{lwp_mwr,iwv_mwr}_std,{lwp_mwr,iwv_mwr}_nb

; MWR MULTI
[input15]
var_to_keep = ta_mwr,rh_mwr,theta_mwr,theta_e_mwr,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_std,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_nb

; cloudnet_radar
[input16]
var_to_keep = zh_dcr,v_dcr,{zh_dcr,v_dcr}_std,{zh_dcr,v_dcr}_nb


[write]
nc_format = ${params:nc_format}

