[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = Zh,v
original_dim_name = time,range
new_dim_name = time,altitude
original_var_name = Zh,v
new_var_name = zh_dcr,v_dcr

[check]
checked_var_minmax = zh_dcr,v_dcr
min_abs = -50,-10
max_abs = 30,10

[convert_1]
dbz_to_z_var = zh_dcr

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {zh_dcr,v_dcr}_mean
var_median = {zh_dcr,v_dcr}_median
var_sum = {zh_dcr,v_dcr}_sum
var_std = {zh_dcr,v_dcr}_std
var_min = {zh_dcr,v_dcr}_min
var_max = {zh_dcr,v_dcr}_max
var_nb = {zh_dcr,v_dcr}_nb
var_q25 = {zh_dcr,v_dcr}_q25
var_q75 = {zh_dcr,v_dcr}_q75
valid_percent = 0.5

[convert_2]
z_to_dbz_var = zh_dcr_mean,zh_dcr_median,zh_dcr_sum,zh_dcr_std,zh_dcr_min,zh_dcr_max,zh_dcr_nb,zh_dcr_q25,zh_dcr_q75

[write]
order_of_dimensions = time,altitude
original_var_name = {zh_dcr,v_dcr}_mean
new_var_name = zh_dcr,v_dcr
nc_format = ${params:nc_format}
var_name = zh_dcr,v_dcr,{zh_dcr,v_dcr}_median,{zh_dcr,v_dcr}_sum,{zh_dcr,v_dcr}_std,{zh_dcr,v_dcr}_min,{zh_dcr,v_dcr}_max,{zh_dcr,v_dcr}_nb,{zh_dcr,v_dcr}_q25,{zh_dcr,v_dcr}_q75

[attrs]
title = REOBS/ CLOUDNET RADAR dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
acknowledgement =
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,REOBS,Meteo-France
contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[zh_dcr]
long_name = Radar reflectivity factor
units = dbZ
comment = Calibrated reflectivity. Calibration convention: in the absence of attenuation, a cloud at 273 K containing one million 100-micron droplets per cubic metre will have a reflectivity of 0 dBZ at all frequencies.
ancillary_variables = zh_dcr_median, zh_dcr_std, zh_dcr_min, zh_dcr_max, zh_dcr_sum, zh_dcr_nb, zh_dcr_q25, zh_dcr_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[v_dcr]
long_name = Doppler velocity
units = m.s^-1
comment = This parameter is the radial component of the velocity, with positive velocities are away from the radar.
ancillary_variables = v_dcr_median, v_dcr_std, v_dcr_min, v_dcr_max, v_dcr_sum, v_dcr_nb, v_dcr_q25, v_dcr_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds
