[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = beta,beta_raw,beta_smooth,calibration_factor,calibration_factor
original_dim_name = time,range
new_dim_name = time,altitude

[convert]
var_to_expand = calibration_factor
expand_along = (time)

[check]
checked_var_minmax = beta
min_abs = 0.00000001
max_abs = 0,01

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = { beta,beta_raw,beta_smooth,calibration_factor}_mean
var_median = { beta,beta_raw,beta_smooth,calibration_factor}_median
var_sum = { beta,beta_raw,beta_smooth,calibration_factor}_sum
var_std = { beta,beta_raw,beta_smooth,calibration_factor}_std
var_min = { beta,beta_raw,beta_smooth,calibration_factor}_min
var_max = { beta,beta_raw,beta_smooth,calibration_factor}_max
var_nb = { beta,beta_raw,beta_smooth,calibration_factor}_nb
var_q25 = { beta,beta_raw,beta_smooth,calibration_factor}_q25
var_q75 = { beta,beta_raw,beta_smooth,calibration_factor}_q75
valid_percent = 0.0

[write]
order_of_dimensions = time,altitude
original_var_name = { beta,beta_raw,beta_smooth,calibration_factor}_mean
new_var_name =  beta,beta_raw,beta_smooth,calibration_factor
nc_format = ${params:nc_format}
var_name =  beta,beta_raw,beta_smooth,calibration_factor,{beta,beta_raw,beta_smooth,calibration_factor}_median,{ beta,beta_raw,beta_smooth,calibration_factor}_sum,{beta,beta_raw,beta_smooth,calibration_factor}_std,{beta,beta_raw,beta_smooth,calibration_factor}_min,{ beta,beta_raw,beta_smooth,calibration_factor}_max,{beta,beta_raw,beta_smooth,calibration_factor}_nb,{beta,beta_raw,beta_smooth,calibration_factor}_q25,{ beta,beta_raw,beta_smooth,calibration_factor}_q75,calibration_factor

