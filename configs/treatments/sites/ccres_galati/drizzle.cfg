[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air
original_dim_name = time,height
new_dim_name = time,altitude

[check]
checked_var_minmax = Do,drizzle_N,drizzle_lwc,v_drizzle,v_air
min_abs = 0.0,0.0,0.0,-5.0,-5.0
max_abs = 0.01,1000000000.0,0.006,0.0,5.0


[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_mean
var_median = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_median
var_sum = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_sum
var_std = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_std
var_min = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_min
var_max = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_max
var_nb = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_nb
var_q25 = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_q25
var_q75 = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_q75
valid_percent = 0.0

[write]
order_of_dimensions = time,altitude
original_var_name = {Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_mean
new_var_name = Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air
nc_format = ${params:nc_format}
var_name = Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_median,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_sum,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_std,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_min,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_max,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_nb,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_q25,{Do,mu,S,drizzle_N,drizzle_lwc,drizzle_lwf,v_drizzle,v_air}_q75

[attrs]
title = REOBS/ CLOUDNET DRIZZLE dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
acknowledgement =
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,REOBS,Meteo-France
contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[Do]
long_name = Drizzle median diameter
units = m
comment = https://doi.org/10.21105/joss.02123
ancillary_variables = Do_median, Do_std, Do_min, Do_max, Do_sum, Do_nb, Do_q25, Do_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[mu]
long_name = Drizzle droplet size distribution shape parameter
units = 1
comment = https://doi.org/10.21105/joss.02123
ancillary_variables = mu_median, mu_std, mu_min, mu_max, mu_sum, mu_nb, mu_q25, mu_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[drizzle_N]
long_name = Drizzle number concentration
units = m^-3
ancillary_variables = drizzle_N_median, drizzle_N_std, drizzle_N_min, drizzle_N_max, drizzle_N_sum, drizzle_N_nb, drizzle_N_q25, drizzle_N_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[drizzle_lwc]
long_name = Drizzle liquid water content
units = kg.m^-3
ancillary_variables = drizzle_lwc_median, drizzle_lwc_std, drizzle_lwc_min, drizzle_lwc_max, drizzle_lwc_sum, drizzle_lwc_nb, drizzle_lwc_q25, drizzle_lwc_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[v_drizzle]
long_name = Drizzle droplet fall velocity
units = m.s^-1
comment = Positive values are towards the ground
ancillary_variables = v_drizzle_median, v_drizzle_std, v_drizzle_min, v_drizzle_max, v_drizzle_sum, v_drizzle_nb, v_drizzle_q25, v_drizzle_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[v_air]
long_name = Vertical air velocity
units = m.s^-1
comment = Positive values are towards the sky
ancillary_variables = v_air_median, v_air_std, v_air_min, v_air_max, v_air_sum, v_air_nb, v_air_q25, v_air_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds
