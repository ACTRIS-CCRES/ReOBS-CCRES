[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = iwc,iwc_retrieval_status
original_var_name = iwc,iwc_retrieval_status
new_var_name = iwc_cl,iwc_status
original_dim_name = time,height
new_dim_name = time,altitude

[check]
checked_var_minmax = iwc_cl
min_abs = 0.0
max_abs = 0.002
checked_var_flags = iwc_cl
flags = iwc_status
flags_to_keep = (1,3,4)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {iwc_cl}_mean
var_median = {iwc_cl}_median
var_sum = {iwc_cl}_sum
var_std = {iwc_cl}_std
var_min = {iwc_cl}_min
var_max = {iwc_cl}_max
var_nb = {iwc_cl}_nb
var_q25 = {iwc_cl}_q25
var_q75 = {iwc_cl}_q75
;valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {iwc_cl}_mean
new_var_name = iwc_cl
nc_format = ${params:nc_format}
var_name = iwc_cl,{iwc_cl}_median,{iwc_cl}_sum,{iwc_cl}_std,{iwc_cl}_min,{iwc_cl}_max,{iwc_cl}_nb,{iwc_cl}_q25,{iwc_cl}_q75

[attrs]
title = REOBS/ CLOUDNET IWC dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
acknowledgement =
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,REOBS,Meteo-France
contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[iwc_cl]
long_name = Liquid Water Content
units = kg m-3
comment = This variable was calculated from the 94-GHz radar reflectivity factor after correction for gaseous attenuation, and temperature taken from a forecast model. Iwc is processed when "categorization" data has diagnosed that the radar echo is due to ice, but note that in some cases supercooled drizzle will erroneously be identified as ice. Missing data indicates either that ice cloud was present but it was only detected by the lidar so its ice water content could not be estimated, or that there was rain below the ice associated with uncertain attenuation of the reflectivities in the ice.
ancillary_variables = iwc_median, iwc_std, iwc_min, iwc_max, iwc_sum, iwc_nb, iwc_q25, iwc_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds