[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = category_bits,quality_bits
original_dim_name = time,height
new_dim_name = time,altitude
original_var_name = category_bits,quality_bits
new_var_name = target_cat_cl,target_quality_cl

[check_1]
checked_var_flags = target_cat_cl
flags = target_quality_cl
flags_to_keep = (0,1,2,3,8,9,10,11,32,33,34,35,40,41,42,43,128,129,130,131,136,137,138,139,160,161,162,163,168,169,170,171,512,513,514,515,520,521,522,523,544,545,546,547,552,553,554,555,640,641,642,643,648,649,650,651,672,673,674,675,680,681,682,683);(0,1)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {target_cat_cl}_mean
var_median = {target_cat_cl}_median
var_sum = {target_cat_cl}_sum
var_std = {target_cat_cl}_std
var_min = {target_cat_cl}_min
var_max = {target_cat_cl}_max
var_nb = {target_cat_cl}_nb
var_q25 = {target_cat_cl}_q25
var_q75 = {target_cat_cl}_q75
var_most_frequent = {target_cat_cl}_most_frequent
var_most_frequent_percent = {target_cat_cl}_most_frequent_percent
var_second_most_frequent = {target_cat_cl}_second_most_frequent
var_second_most_frequent_percent = {target_cat_cl}_second_most_frequent_percent
#valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {target_cat_cl}_mean
new_var_name = target_cat_cl
nc_format = ${params:nc_format}
var_name = target_cat_cl,{target_cat_cl}_median,{target_cat_cl}_sum,{target_cat_cl}_std,{target_cat_cl}_min,{target_cat_cl}_max,{target_cat_cl}_nb,{target_cat_cl}_q25,{target_cat_cl}_q75,{target_cat_cl}_most_frequent,{target_cat_cl}_most_frequent_percent,{target_cat_cl}_second_most_frequent,{target_cat_cl}_second_most_frequent_percent

