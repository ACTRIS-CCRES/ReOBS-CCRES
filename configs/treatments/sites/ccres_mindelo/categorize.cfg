standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[target_cat_cl]
long_name = Target categorization
units = 1
comment = This variable contains information on the nature of the targets at each pixel, thereby facilitating the application of algorithms that work with only one type of target. The information is in the form of an array of bits, each of which states either whether a certain type of particle is present (e.g. aerosols), or the whether some of the target particles have a particular property. The definitions of each bit are given in the definition attribute. Bit 0 is the least significant.\nBit 0: Small liquid droplets are present.\nBit 1: Falling hydrometeors are present if Bit 2 is set then these are most likely ice particles, otherwise they are drizzle or rain drops.\nBit 2: Wet-bulb temperature is less than 0 degrees C, implying the phase of Bit-1 particles.\nBit 3: Melting ice particles are present.\nBit 4: Aerosol particles are present and visible to the lidar.\nBit 5: Insects are present and visible to the radar.
ancillary_variables = target_cat_cl_median, target_cat_cl_std, target_cat_cl_min, target_cat_cl_max, target_cat_cl_sum, target_cat_cl_nb, target_cat_cl_q25, target_cat_cl_q75
cell_methods= time:mean, altitude:mean
dtype = int32
theme=clouds