[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = beta,depolarisation,calibration_factor
original_var_name = beta,depolarisation,calibration_factor
new_var_name = bck_alc,depol_bck,calibration_factor_alc
original_dim_name = range
new_dim_name = altitude

[check]
checked_var_minmax = bck_alc
min_abs = 0.00000001
max_abs = 0.01

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {bck_alc,depol_bck,calibration_factor_alc}_mean
var_median = {bck_alc,depol_bck}_median
var_sum = {bck_alc,depol_bck}_sum
var_std = {bck_alc,depol_bck}_std
var_min = {bck_alc,depol_bck}_min
var_max = {bck_alc,depol_bck}_max
var_nb = {bck_alc,depol_bck}_nb
var_q25 = {bck_alc,depol_bck}_q25
var_q75 = {bck_alc,depol_bck}_q75
;valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {bck_alc,depol_bck}_median,{calibration_factor_alc}_mean
new_var_name = bck_alc,depol_bck,calibration_factor_alc
nc_format = ${params:nc_format}
var_name = bck_alc,depol_bck,calibration_factor_alc,{bck_alc,depol_bck}_mean,{bck_alc,depol_bck}_sum,{bck_alc,depol_bck}_std,{bck_alc,depol_bck}_min,{bck_alc,depol_bck}_max,{bck_alc,depol_bck}_nb,{bck_alc,depol_bck}_q25,{bck_alc,depol_bck}_q75

[attrs]
title = REOBS/ CLOUDNET LIDAR dataset
summary =
