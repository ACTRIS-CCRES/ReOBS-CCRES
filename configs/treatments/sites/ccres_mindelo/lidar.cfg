instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[calibration_factor_alc]
long_name = Attenuated backscatter calibration factor
units = 1
comment = 
ancillary_variables = Calibration factor applied.
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[bck_alc]
long_name = Attenuated backscatter coefficient
units = sr^-1.m^-1
comment = SNR-screened attenuated backscatter coefficient. Weak background smoothed using Gaussian 2D-kernel. SNR threshold applied: 5.
ancillary_variables = bck_alc_mean, bck_alc_std, bck_alc_min, bck_alc_max, bck_alc_sum, bck_alc_nb, bck_alc_q25, bck_alc_q75
cell_methods= time:median, altitude:median
dtype = float32
theme=clouds

[depol_bck]
long_name = Lidar volume linear depolarisation ratio
units = 1
comment = SNR-screened lidar volume linear depolarisation ratio at 532 nm.
ancillary_variables = depol_bck_mean, depol_bck_std, depol_bck_min, depol_bck_max, depol_bck_sum, depol_bck_nb, depol_bck_q25, depol_bck_q75
cell_methods= time:median, altitude:median
dtype = float32
theme=clouds
