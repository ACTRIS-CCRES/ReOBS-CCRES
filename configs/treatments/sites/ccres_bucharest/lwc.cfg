[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = lwc,lwc_retrieval_status
original_dim_name = time,height
new_dim_name = time,altitude
original_var_name = lwc,lwc_retrieval_status
new_var_name = lwc_cl,lwc_status

[check]
checked_var_minmax = lwc_cl
min_abs = 0.0
max_abs = 0.015
checked_var_flags = lwc_cl
flags = lwc_status
flags_to_keep = (1,2)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {lwc_cl,lwc_status}_mean
var_median = {lwc_cl,lwc_status}_median
var_sum = {lwc_cl,lwc_status}_sum
var_std = {lwc_cl,lwc_status}_std
var_min = {lwc_cl,lwc_status}_min
var_max = {lwc_cl,lwc_status}_max
var_nb = {lwc_cl,lwc_status}_nb
var_q25 = {lwc_cl,lwc_status}_q25
var_q75 = {lwc_cl,lwc_status}_q75
valid_percent = 0.0

[write]
order_of_dimensions = time,altitude
original_var_name = {lwc_cl,lwc_status}_mean
new_var_name = lwc_cl,lwc_status
nc_format = ${params:nc_format}
var_name = lwc_cl,lwc_status,{lwc_cl,lwc_status}_median,{lwc_cl,lwc_status}_sum,{lwc_cl,lwc_status}_std,{lwc_cl,lwc_status}_min,{lwc_cl,lwc_status}_max,{lwc_cl,lwc_status}_nb,{lwc_cl,lwc_status}_q25,{lwc_cl,lwc_status}_q75

[attrs]
title = REOBS/ CLOUDNET LWC dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
acknowledgement =
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,REOBS,Meteo-France
contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[lwc_cl]
long_name = Liquid Water Content
units = kg m-3
comment = This variable was calculated for the profiles where the categorization data has diagnosed that liquid water is present and liquid water path is available from a coincident microwave radiometer. The model temperature and pressure were used to estimate the theoretical adiabatic liquid water content gradient for each cloud base and the adiabatic liquid water content is then scaled that its integral matches the radiometer measurement so that the liquid water content now follows a quasi-adiabatic profile.
ancillary_variables = lwc_median, lwc_std, lwc_min, lwc_max, lwc_sum, lwc_nb, lwc_q25, lwc_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[lwc_status]
long_name = lwc retrieval status
units = 1
comment = This variable describes whether a retrieval was performed for each pixel, and its associated quality, in the form of 6 different classes. The classes are defined in the definition attribute.\nValue = 1 : both radar and lidar detect the liquid layer, and microwave radiometer data is present \nValue = 2 : microwave radiometer data is used to adjust the cloud depth when the radar does not detect the liquid layer\nValue = 3 : cloud pixels that have been added at cloud top to avoid the profile becoming superadiabatic\nValue = 4 : microwave radiometer data were not available or not reliable (melting level present or unphysical values) but the liquid layers were well defined\nValue = 5 : cloud top was not well defined\nValue = 6 : no lwc if rain is presen
ancillary_variables = lwc_cl_status_median, lwc_cl_status_std, lwc_cl_status_min, lwc_cl_status_max, lwc_cl_status_sum, lwc_cl_status_nb, lwc_cl_status_q25, lwc_cl_status_q75
cell_methods= time:mean, altitude:mean
dtype = int32
theme=clouds
