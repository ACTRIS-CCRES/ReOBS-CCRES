instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[rainfall_rate]
long_name = rainfall rate
units = mm h^-1
comment = 
ancillary_variables = rainfall_rate_median, rainfall_rate_std, rainfall_rate_min, rainfall_rate_max, rainfall_rate_nb, rainfall_rate_q25, rainfall_rate_q75
cell_methods = time:mean
dtype = float32
theme = surface_meteorology

[snowfall_rate]
long_name =  snowfall rate
units = m s-1
comment = Snow depth intensity (volume equivalent)
ancillary_variables = snowfall_rate_median, snowfall_rate_std, snowfall_rate_min, snowfall_rate_max, snowfall_rate_sum, snowfall_rate_nb, snowfall_rate_q25, snowfall_rate_q75
cell_methods = time:mean
dtype = float32
theme = surface_meteorology

[n_particles]
long_name = Number of particles in time interval
units = 
comment = 
ancillary_variables = n_particles_median, n_particles_std, n_particles_min, n_particles_max, n_particles_sum, n_particles_nb, n_particles_q25, n_particles_q75
cell_methods = time:mean
dtype = float32
theme = surface_meteorology