[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = rainfall_rate,radar_reflectivity,n_particles,state_sensor,V_power_supply,sig_laser
original_dim_name = time
new_dim_name = time

[convert]
var_to_convert = rainfall_rate
operation = *3600*1000

[check_1]
checked_var_flags = state_sensor
flags = state_sensor
flags_to_keep = (0)

[check_2]
checked_var_minmax = V_power_supply,sig_laser
min_abs = 10,10000
max_abs = 28,1000000

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = ${params:time_resolution}
var_computation_offset = ${params:time_offset}
var_computation_how = ${params:time_how}
var_mean = {rainfall_rate,n_particles}_mean
var_median = {rainfall_rate,n_particles}_median
var_sum = {rainfall_rate,n_particles}_sum
var_std = {rainfall_rate,n_particles}_std
var_min = {rainfall_rate,n_particles}_min
var_max = {rainfall_rate,n_particles}_max
var_nb = {rainfall_rate,n_particles}_nb
var_q25 = {rainfall_rate,n_particles}_q25
var_q75 = {rainfall_rate,n_particles}_q75
valid_percent = 0.0

[write]
order_of_dimensions = time
original_var_name = {n_particles}_mean, {rainfall_rate}_sum
new_var_name = rainfall_rate,n_particles
nc_format = ${params:nc_format}
var_name = rainfall_rate,n_particles,{rainfall_rate,n_particles}_median,{n_particles}_sum,{rainfall_rate,n_particles}_std,{rainfall_rate,n_particles}_min,{rainfall_rate,n_particles}_max,{rainfall_rate,n_particles}_nb,{rainfall_rate,n_particles}_q25,{rainfall_rate,n_particles}_q75

[attrs]
title = REOBS CCRES Disdrometer dataset
summary =
keywords =
