[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = temperature,relative_humidity,potential_temperature,equivalent_potential_temperature,temperature_quality_flag
original_dim_name = time,height
new_dim_name = time,altitude
original_var_name = temperature,relative_humidity,potential_temperature,equivalent_potential_temperature,temperature_quality_flag
new_var_name = ta_mwr,rh_mwr,theta_mwr,theta_e_mwr,ta_flag

[check_1]
checked_var_flags = ta_mwr,theta_mwr,theta_e_mwr
flags = ta_flag,ta_flag,ta_flag
flags_to_keep = (0),(0),(0)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_mean
var_median = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_median
var_sum = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_sum
var_std = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_std
var_min = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_min
var_max = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_max
var_nb = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_nb
var_q25 = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q25
var_q75 = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q75
valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_mean
new_var_name = ta_mwr,rh_mwr,theta_mwr,theta_e_mwr
nc_format = ${params:nc_format}
var_name = ta_mwr,rh_mwr,theta_mwr,theta_e_mwr,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_median,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_sum,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_std,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_min,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_max,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_nb,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q25,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q75

