[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = rainfall_rate,rainfall_amount
original_var_name = rainfall_rate,rainfall_amount
new_var_name = pr_ws,ra_ws
original_dim_name = time
new_dim_name = time

[convert]
var_to_convert = pr_ws,ra_ws
operation = *1000*3600,*1000

[check]
checked_var_minmax = pr_ws,ra_ws
min_abs = 0,0
max_abs = 5,200

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = ${params:time_resolution}
var_computation_offset = ${params:time_offset}
var_computation_how = ${params:time_how}
var_mean = {pr_ws}_mean
var_median = {pr_ws}_median
var_sum = {pr_ws,ra_ws}_sum
var_std = {pr_ws,ra_ws}_std
var_min = {pr_ws,ra_ws}_min
var_max = {pr_ws,ra_ws}_max
var_nb = {pr_ws,ra_ws}_nb
var_q25 = {pr_ws,ra_ws}_q25
var_q75 = {pr_ws,ra_ws}_q75
# valid_percent = 0.5

[write]
order_of_dimensions=time
original_var_name = {pr_ws}_mean,{ra_ws}_sum
new_var_name = pr_ws,ra_ws
nc_format = ${params:nc_format}
var_name = pr_ws,ra_ws,{pr_ws}_median,{pr_ws}_sum,{pr_ws,ra_ws}_std,{pr_ws,ra_ws}_min,{pr_ws,ra_ws}_max,{pr_ws,ra_ws}_nb,{pr_ws,ra_ws}_q25,{pr_ws,ra_ws}_q75

[attrs]
title = ReOBS-CCRES raingauge dataset
summary = The ReOBS dataset is contained in a single netCDF file containing mean values of more than 150 physical variables. Variables entering the ReOBS dataset are quality controlled at their native time resolution. The objective of ReObs is also to respect the FAIR principles (Findable, Accessible, Interoperable, Reusable) in particular the Reusable aspect which is more obvious for a production chain.
keywords = GCMD: ATMOSPHERE,GCMD: AEROSOLS,GCMD: AIR QUALITY,GCMD: ATMOSPHERIC PRESSURE,GCMD:  LAND SURFACE/AGRICULTURE INDICATORS,GCMD: ATMOSPHERIC RADIATION,GCMD: ATMOSPHERIC TEMPERATURE,GCMD: ATMOSPHERIC WATER VAPOR,GCMD: ATMOSPHERIC WINDS,GCMD: CLOUDS,GCMD: PRECIPITATION,GCMD: DATA ANALYSIS AND VISUALIZATION,GCMD: CALIBRATION/VALIDATION,GCMD: DATA ANALYSIS,GCMD: STATISTICAL APPLICATIONS
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = Cloudnet data portal
comment = Technical and scientific staff of SIRTA site discuss with AERIS data center staff to develop the quality check and provide the metadata information concerning variables and instruments.
acknowledgement = The ReOBS database is maintained by the French national center for Atmospheric data and services AERIS. We extend our acknowledgments to the technical and computer staff of SIRTA Observatory for taking the observations and making the data set easily accessible.We also thanks the ACTRIS-FR Research Infrastructure for their support in this study.
license = Inspired by CC-BY
standard_name_vocabulary = CF Standard Name Table v76
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,SIRTA,REOBS,Meteo-France
contributor_role = AERIS is the data center, SIRTA is the observatory where all the instruments are installed, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Laboratory Instruments,GCMD: Current/Wind Meters,GCMD: SONIC ANEMOMETER,GCMD: ANEMOMETERS,GCMD: EDDY CORRELATION DEVICES,GCMD: Gauges,GCMD: RAIN GAUGES,GCMD: Photon/Optical Detectors,GCMD: Pressure/Height Meters,GCMD: Probes,GCMD: SOIL MOISTURE PROBE,GCMD: TEMPERATURE PROBES,GCMD: Profilers/Sounders,GCMD: Radiation Sensors,GCMD: Temperature/Humidity Sensors,GCMD: Scatterometers,GCMD: Passive Remote Sensing,GCMD: Active Remote Sensing,GCMD: Photon/Optical Detectors,GCMD: Profilers/Sounders
instrument_vocabulary = GCMD

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[pr_ws]
standard_name = lwe_precipitation_rate
long_name = Precipitation rate at 1m agl
units = mm.h^-1
comment = The abbreviation lwe means liquid water equivalent. Precipitation rate means the depth or thickness of the layer formed by precipitation per unit time.
instrument =
dtype = float32
ancillary_variables = pr_ws_median, pr_ws_std, pr_ws_min, pr_ws_max, pr_ws_sum, pr_ws_nb, pr_ws_q25, pr_ws_q75
cell_methods = time: mean
coverage_content_type = physicalMeasurement
IQF0 = [-]
theme = surface_meteorology

[ra_ws]
standard_name = thickness_of_rainfall_amount
long_name = Precipitation amount at 1m agl since 00:00 UTC
units = mm
comment =
instrument =
dtype = float32
ancillary_variables = ra_ws_median, ra_ws_std, ra_ws_min, ra_ws_max, ra_ws_nb, ra_ws_q25, ra_ws_q75
cell_methods = time: sum
coverage_content_type = physicalMeasurement
IQF0 = [-]
theme = surface_meteorology
