
[DEFAULT]
dim_time = time

; cloudnet_categorize
[input01]
var_to_keep = {target_cat,target_quality}_most_frequent,{target_cat,target_quality}_most_frequent_percent,{target_cat,target_quality}_second_most_frequent,{target_cat,target_quality}_second_most_frequent_percent

; cloudnet_classification
[input02]
var_to_keep =  {target_classification}_most_frequent,{target_classification}_most_frequent_percent,{target_classification}_second_most_frequent,{target_classification}_second_most_frequent_percent,cbh,cth,{cbh,cth}_median,{cbh,cth}_min,{cbh,cth}_max,{cbh,cth}_q25,{cbh,cth}_q75,{cbh,cth}_nb

; cloudnet_drizzle
[input03]
var_to_keep =  Do,mu,drizzle_N,drizzle_lwc,v_drizzle,v_air,{Do,mu,drizzle_N,drizzle_lwc,v_drizzle,v_air}_std,{Do,mu,drizzle_N,drizzle_lwc,v_drizzle,v_air}_nb

; cloudnet_iwc
[input04]
var_to_keep =  iwc,{iwc}_std,{iwc}_nb

; cloudnet_lidar
[input05]
var_to_keep  = beta,beta_raw,{beta,beta_raw}_std,{beta,beta_raw}_nb

; cloudnet_lwc
[input06]
var_to_keep =  lwc,{lwc}_std,{lwc}_nb

; MWR Single
;[input07]
;var_to_keep = lwp_mwr,iwv_mwr,{lwp_mwr,iwv_mwr}_median,{lwp_mwr,iwv_mwr}_sum,{lwp_mwr,iwv_mwr}_std,{lwp_mwr,iwv_mwr}_min,{lwp_mwr,iwv_mwr}_max,{lwp_mwr,iwv_mwr}_nb,{lwp_mwr,iwv_mwr}_q25,{lwp_mwr,iwv_mwr}_q75

; MWR Single AH
;[input08]
;var_to_keep = ah_mwr,{ah_mwr}_median,{ah_mwr}_sum,{ah_mwr}_std,{ah_mwr}_min,{ah_mwr}_max,{ah_mwr}_nb,{ah_mwr}_q25,{ah_mwr}_q75

; MWR L1C
[input09]
var_to_keep = tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_median,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_sum,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_std,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_min,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_max,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_nb,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q25,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q75

; MWR MULTI
[input10]
var_to_keep = ta_mwr,rh_mwr,theta_mwr,theta_e_mwr,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_median,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_sum,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_std,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_min,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_max,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_nb,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q25,{ta_mwr,rh_mwr,theta_mwr,theta_e_mwr}_q75

; cloudnet_radar
[input11]
var_to_keep = Zh,v,{Zh,v}_std,{Zh,v}_nb

; cloudnet_disdrometer
[input12]
var_to_keep = rainfall_rate,n_particles,{rainfall_rate,n_particles}_std,{rainfall_rate,n_particles}_nb

; cloudnet_disdrometer_raw
[input13]
var_to_keep = data_raw,{data_raw}_std,{data_raw}_nb

; cloudnet_meteo
[input14]
var_to_keep = ws,wd,ta,hur,ps,ua,va,psl,huss,pr,{ws,wd,ta,hur,ps,ua,va,psl,huss}_std,{ws,wd,ta,hur,ps,ua,va,psl,huss}_nb

