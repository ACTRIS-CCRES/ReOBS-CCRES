[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = N_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status
original_var_name = N_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status
new_var_name = n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status
original_dim_name = height
new_dim_name = altitude

[check]
;checked_var_minmax = iwc_cl
;min_abs = 0.0
;max_abs = 0.002
checked_var_flags = n_scaled,der,der_scaled,der_error,der_scaled_error
flags = der_retrieval_status
flags_to_keep = (0,1,2)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_mean
var_median = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_median
var_sum = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_sum
var_std = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_std
var_min = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_min
var_max = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_max
var_nb = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_nb
var_q25 = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_q25
var_q75 = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_q75
var_most_frequent = {der_retrieval_status}_most_frequent
var_most_frequent_percent = {der_retrieval_status}_most_frequent_percent
var_second_most_frequent = {der_retrieval_status}_second_most_frequent
var_second_most_frequent_percent = {der_retrieval_status}_second_most_frequent_percent
# valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_mean
new_var_name = n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status
nc_format = ${params:nc_format}
var_name = n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_median,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_sum,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_std,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_min,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_max,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_nb,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_q25,{n_scaled,der,der_scaled,der_error,der_scaled_error,der_retrieval_status}_q75,{der_retrieval_status}_most_frequent,{der_retrieval_status}_most_frequent_percent,{der_retrieval_status}_second_most_frequent,{der_retrieval_status}_second_most_frequent_percent

