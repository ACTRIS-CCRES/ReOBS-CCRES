instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[n_scaled]
long_name = Cloud droplet number concentration
units = 1
comment = From scaled Frisch method the cloud droplet number concentration\ncan be derived.
ancillary_variables = n_scaled_mean, n_scaled_std, n_scaled_sum, n_scaled_min, n_scaled_max, n_scaled_nb, n_scaled_q25, n_scaled_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[der]
long_name = Droplet effective radius
units = m
comment = This variable was calculated for the profiles where the categorization\ndata has diagnosed that liquid water is present the cloud droplet\neffective radius is calculated after Frisch et al (2002), relating Z\nwith def by assuming a lognormal size distribution its width and the\nnumber concentration of the cloud droplets.
ancillary_variables = der_mean, der_std, der_sum, der_min, der_max, der_nb, der_q25, der_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[der_error]
long_name = Absolute error in droplet effective radius
units = m
comment = This variable is an estimate of the random error in effective\nradius assuming an error in Z of ddBZ = 2.0 in N of\ndN = 200000000.0 and in the spectral width dsigma_x = 0.1\nand in the LWP Q of 0.005 kg m-3.
ancillary_variables = der_error_mean, der_error_std, der_error_sum, der_error_min, der_error_max, der_error_nb, der_error_q25, der_error_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[der_scaled]
long_name = Droplet effective radius (scaled to LWP)
units = m
comment = This variable was calculated for the profiles where the\ncategorization data has diagnosed that liquid water is present\nthe cloud droplet effective radius is calculated after\nFrisch et al. (2002), relating Z with def by assuming a lognormal\nsize distribution and its width. The number concentration required\nto represent the size distribution is derived by scaling the LWP\n measured with microwave radiometer over the observed (single) cloud layer.
ancillary_variables = der_scaled_mean, der_scaled_std, der_scaled_sum, der_scaled_min, der_scaled_max, der_scaled_nb, der_scaled_q25, der_scaled_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[der_scaled_error]
long_name = Absolute error in droplet effective radius (scaled to LWP)
units = m
comment = This variable was calculated for the profiles where the categorization data.
ancillary_variables = der_scaled_error_mean, der_scaled_error_std, der_scaled_error_sum, der_scaled_error_min, der_scaled_error_max, der_scaled_error_nb, der_scaled_error_q25, der_scaled_error_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[der_retrieval_status]
long_name = Droplet effective radius retrieval status
units = 1
comment = \nValue 0: No data: No cloud observed.\nValue 1: Reliable retrieval.\nValue 2: Mix of drops and ice: Droplets and ice crystals coexist\n         within pixel. Z may be biased by large crystals.\nValue 3: Precipitation in profile: Drizzle and rain affects LWP\n         retrieval of MWR but also the target reflectivity.\nValue 4: Surrounding ice: Less crucial! Ice crystals in the vicinity\n         of a droplet pixel may also bias its reflectivity.
ancillary_variables = der_retrieval_status_mean, der_retrieval_status_std, der_retrieval_status_sum, der_retrieval_status_min, der_retrieval_status_max, der_retrieval_status_nb, der_retrieval_status_q25, der_retrieval_status_q75, der_retrieval_status_most_frequent,der_retrieval_status_most_frequent_percent,der_retrieval_status_second_most_frequent,der_retrieval_status_second_most_frequent_percent
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds
