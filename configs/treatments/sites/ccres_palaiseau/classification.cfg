[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[cbh]
long_name = Height of cloud base above ground level
units = m
ancillary_variables = cbh_median, cbh_std, cbh_min, cbh_max, cbh_sum, cbh_nb, cbh_q25, cbh_q75
cell_methods= time:mean
dtype = float32
theme=clouds

[cth]
long_name = Height of cloud top above ground level
units = m
ancillary_variables = cth_median, cth_std, cth_min, cth_max, cth_sum, cth_nb, cth_q25, cth_q75
cell_methods= time:mean
dtype = float32
theme=clouds

[target_classification]
long_name = Target classification
units = 1
comment = This variable provides the main atmospheric target classifications that can be distinguished by radar and lidar.\nValue 0: Clear sky.\nValue 1: Cloud liquid droplets only.\nValue 2: Drizzle or rain.\nValue 3: Drizzle or rain coexisting with cloud liquid droplets.\nValue 4: Ice particles.\nValue 5: Ice coexisting with supercooled liquid droplets.\nValue 6: Melting ice particles.\nValue 7: Melting ice particles coexisting with cloud liquid droplets.\nValue 8: Aerosol particles, no cloud or precipitation.\nValue 9: Insects, no cloud or precipitation.\nValue 10: Aerosol coexisting with insects, no cloud or precipitation
ancillary_variables = target_classification_median, target_classification_std, target_classification_min, target_classification_max, target_classification_sum, target_classification_nb, target_classification_q25, target_classification_q75
cell_methods= time:mean, altitude:mean
dtype = int32
theme=clouds
