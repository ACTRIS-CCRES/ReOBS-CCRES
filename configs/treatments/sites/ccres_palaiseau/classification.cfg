[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = target_classification,detection_status,cloud_base_height_agl,cloud_top_height_agl
original_dim_name = time,height
new_dim_name = time,altitude
original_var_name = cloud_base_height_agl,cloud_top_height_agl
new_var_name = cbh,cth

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {target_classification,detection_status,cbh,cth}_mean
var_median = {target_classification,detection_status,cbh,cth}_median
var_sum = {target_classification,detection_status,cbh,cth}_sum
var_std = {target_classification,detection_status,cbh,cth}_std
var_min = {target_classification,detection_status,cbh,cth}_min
var_max = {target_classification,detection_status,cbh,cth}_max
var_nb = {target_classification,detection_status,cbh,cth}_nb
var_q25 = {target_classification,detection_status,cbh,cth}_q25
var_q75 = {target_classification,detection_status,cbh,cth}_q75
var_most_frequent = {target_classification,detection_status}_most_frequent
var_most_frequent_percent = {target_classification,detection_status}_most_frequent_percent
var_second_most_frequent = {target_classification,detection_status}_second_most_frequent
var_second_most_frequent_percent = {target_classification,detection_status}_second_most_frequent_percent
valid_percent = 0.0

[add]
vars_to_duplicate=cbh_nb
new_duplicated_names=cloud_occurence

[convert]
var_to_convert = cloud_occurence
operation = *100/120

[write]
order_of_dimensions = time,altitude
original_var_name = {target_classification,detection_status,cbh,cth}_mean
new_var_name = target_classification,detection_status,cbh,cth
nc_format = ${params:nc_format}
var_name = target_classification,detection_status,cbh,cth,{target_classification,detection_status,cbh,cth}_median,{target_classification,detection_status,cbh,cth}_sum,{target_classification,detection_status,cbh,cth}_std,{target_classification,detection_status,cbh,cth}_min,{target_classification,detection_status,cbh,cth}_max,{target_classification,detection_status,cbh,cth}_nb,{target_classification,detection_status,cbh,cth}_q25,{target_classification,detection_status,cbh,cth}_q75,{target_classification,detection_status}_most_frequent,{target_classification,detection_status}_most_frequent_percent,{target_classification,detection_status}_second_most_frequent,{target_classification,detection_status}_second_most_frequent_percent,cloud_occurence

