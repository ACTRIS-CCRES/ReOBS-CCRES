[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = ier,ier_error,ier_retrieval_status
original_var_name = ier,ier_error,ier_retrieval_status
new_var_name = ier,ier_error,ier_retrieval_status
original_dim_name = height
new_dim_name = altitude

[check]
;checked_var_minmax = iwc_cl
;min_abs = 0.0
;max_abs = 0.002
checked_var_flags = ier
flags = ier_retrieval_status
flags_to_keep = (0,1,3,4)

[treat]
treater = ND
var_computation_on_dim = time,altitude
var_computation_grid = (${params:time_resolution}),(${params:altitude_resolution})
var_computation_offset = (${params:time_offset}),(${params:altitude_offset})
var_computation_how = ${params:time_how},${params:altitude_how}
var_mean = {ier,ier_error,ier_retrieval_status}_mean
var_median = {ier,ier_error,ier_retrieval_status}_median
var_sum = {ier,ier_error,ier_retrieval_status}_sum
var_std = {ier,ier_error,ier_retrieval_status}_std
var_min = {ier,ier_error,ier_retrieval_status}_min
var_max = {ier,ier_error,ier_retrieval_status}_max
var_nb = {ier,ier_error,ier_retrieval_status}_nb
var_q25 = {ier,ier_error,ier_retrieval_status}_q25
var_q75 = {ier,ier_error,ier_retrieval_status}_q75
var_most_frequent = {ier_retrieval_status}_most_frequent
var_most_frequent_percent = {ier_retrieval_status}_most_frequent_percent
var_second_most_frequent = {ier_retrieval_status}_second_most_frequent
var_second_most_frequent_percent = {ier_retrieval_status}_second_most_frequent_percent
;valid_percent = 0.5

[write]
order_of_dimensions = time,altitude
original_var_name = {ier,ier_error,ier_retrieval_status}_mean
new_var_name = ier,ier_error,ier_retrieval_status
nc_format = ${params:nc_format}
var_name = ier,ier_error,ier_retrieval_status,{ier,ier_error,ier_retrieval_status}_median,{ier,ier_error,ier_retrieval_status}_sum,{ier,ier_error,ier_retrieval_status}_std,{ier,ier_error,ier_retrieval_status}_min,{ier,ier_error,ier_retrieval_status}_max,{ier,ier_error,ier_retrieval_status}_nb,{ier,ier_error,ier_retrieval_status}_q25,{ier,ier_error,ier_retrieval_status}_q75,{ier_retrieval_status}_most_frequent,{ier_retrieval_status}_most_frequent_percent,{ier_retrieval_status}_second_most_frequent,{ier_retrieval_status}_second_most_frequent_percent

[attrs]
title = REOBS/ CLOUDNET LIDAR dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.7, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = AERIS data center,ACTRIS-FR
comment =
