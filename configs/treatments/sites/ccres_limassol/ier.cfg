contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[altitude]
long_name = altitude
units = m
dtype = float32

[ier]
long_name = Ice effective radius
units = m
comment = This variable was calculated from the 35.5-GHz radar\nreflectivity factor after correction for gaseous attenuation,\nand temperature taken from a forecast model, using the following\nempirical formula: log10(ier[m]) = (-0.000205 * Z[dBZ] * T[degC]\n+ 0.0016 * Z[dBZ] + -0.0015 * T[degC] + -1.52)\n* 3 / (2 * 917[kg/m3]). In this formula Z is taken\nto be defined such that all frequencies of radar would measure the\nsame Z in Rayleigh scattering ice. However, the radar is more likely\nto have been calibrated such that all frequencies would measure\nthe same Z in Rayleigh scattering liquid cloud at 0 degrees C.\nThe measured Z is therefore multiplied by\n |K(liquid,0degC,35.5GHz)|^2/0.93 = 0.944 before applying\nthis formula. The formula has been used where the categorization \n data has diagnosed that the radar echo is due to ice, but note\nthat in some cases supercooled drizzle will erroneously be identified\nas ice. Missing data indicates either that ice cloud was present but it was\nonly detected by the lidar so its ice water content could not be estimated.
ancillary_variables = ier_mean, ier_std, ier_sum, ier_min, ier_max, ier_nb, ier_q25, ier_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[ier_error]
long_name = Random error in ice effective radius
units = m
comment = Error in effective radius of ice particles due to error propagation,\nof ier = 3/(2 rho_i) IWC / alpha, using error for IWC and alpha as\ngiven in Hogan 2006.
ancillary_variables = ier_error_mean, ier_error_std, ier_error_sum, ier_error_min, ier_error_max, ier_error_nb, ier_error_q25, ier_error_q75
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds

[ier_retrieval_status]
long_name = Ice effective radius retrieval status
units = 1
comment = This variable describes whether a retrieval was performed\nfor each pixel, and its associated quality. \nValue 0: No ice present.\nValue 1: Reliable retrieval.\nValue 2: Unreliable retrieval due to uncorrected liquid, rain or\n         melting attenuation.\nValue 3: Retrieval performed with radar corrected for liquid, rain and\n         melting attenuation.\nValue 4: Ice detected only by the lidar.\nValue 5: Uncorrected rain attenuation (deprecated).\nValue 6: Clear sky above rain and wet-bulb temperature less than\n         0degC: if rain attenuation is strong, ice could be present\n         but undetected.\nValue 7: Drizzle or rain that would have been classified as ice if the\n         wet-bulb temperature were less than 0degC: may be ice if\n         temperature is in error.
ancillary_variables = ier_retrieval_status_mean, ier_retrieval_status_std, ier_retrieval_status_sum, ier_retrieval_status_min, ier_retrieval_status_max, ier_retrieval_status_nb, ier_retrieval_status_q25, ier_retrieval_status_q75, ier_retrieval_status_most_frequent,ier_retrieval_status_most_frequent_percent,ier_retrieval_status_second_most_frequent,ier_retrieval_status_second_most_frequent_percent
cell_methods= time:mean, altitude:mean
dtype = float32
theme=clouds
