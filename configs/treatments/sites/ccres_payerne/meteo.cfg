[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[ws_ws]
standard_name = wind_speed
long_name = Wind speed
units = m.s^-1
comment = 
instrument = 
dtype = float32
ancillary_variables = ws_ws_median, ws_ws_std, ws_ws_min, ws_ws_max, ws_ws_sum, ws_ws_nb, ws_ws_q25, ws_ws_q75
cell_methods = time: mean
coverage_content_type = physicalMeasurement
IQF0 = [-]
theme = surface_meteorology

[wd_ws]
standard_name = wind_to_direction
long_name = Wind direction
units = degree
comment = In meteorological reports, the direction of the wind vector is usually (but not always) given as the direction from which it is blowing (wind_from_direction) (westerly, northerly, etc.). The direction is a bearing in the usual geographical sense, measured positive clockwise from due north.
instrument = 
dtype = float32
ancillary_variables = wd_ws_median, wd_ws_std, wd_ws_min, wd_ws_max, wd_ws_sum, wd_ws_nb, wd_ws_q25, wd_ws_q75
cell_methods = time: mean
coverage_content_type = physicalMeasurement
IQF0 = [-]
theme = surface_meteorology

[ta_ws]
standard_name = air_temperature
long_name = Air temperature
units = Celsius
comment = 
