[DEFAULT]
dim_time = time

[read]
reader = netcdf
selected_var_name = wind_speed,wind_direction,air_temperature,relative_humidity,air_pressure,rainfall_rate,rainfall_amount
original_var_name = wind_speed,wind_direction,air_temperature,relative_humidity,air_pressure,rainfall_rate,rainfall_amount
new_var_name = ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,pr_ws,ra_ws
original_dim_name = time
new_dim_name = time

[convert]
var_to_convert = ta_ws,hur_ws,ps_ws,pr_ws,ra_ws
operation = -273.15,*100,/100,*1000*3600,*1000

[check]
checked_var_minmax = ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,pr_ws,ra_ws
min_abs = 0,0,-30,3,960,0,0
max_abs = 40,360,50,103,1030,5,200
checked_var_min_std = ta_ws,hur_ws,ps_ws
min_std_window = 60,60,60
min_std = 0,0,0
min_std_nb_sigma = 1,1,1
checked_var_max_std = ws_ws,ta_ws,hur_ws,ps_ws
QC3_window = 15,15,15,15
QC3_alpha = 0.3,0.25,1.2,0.15
QC3_gamma = 1.8,0.2,1.1,0.12
QC3_beta = 10,10,10,10

[add]
var_uv = ua_ws,va_ws
var_uv_needed = ws_ws,wd_ws
var_Sa_Ca = Sa_ws,Ca_ws
var_Sa_Ca_needed = wd_ws
var_psl = psl_ws
var_psl_needed = ta_ws,ps_ws
var_huss = huss_ws
var_huss_needed = hur_ws,psl_ws,ta_ws,ps_ws

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = ${params:time_resolution}
var_computation_offset = ${params:time_offset}
var_computation_how = ${params:time_how}
var_mean = {ws_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws}_mean
var_median = {ws_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws}_median
var_sum = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_sum
var_std = {ws_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_std
var_min = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_min
var_max = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_max
var_nb = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_nb
var_q25 = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_q25
var_q75 = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_q75
valid_percent = 0.5

[add_1]
var_wd_mean = wd_ws_mean
var_wd_mean_needed = ua_ws_mean,va_ws_mean
var_wd_std = wd_ws_std
var_wd_std_needed = Sa_ws_mean,Ca_ws_mean

[write]
order_of_dimensions=time
original_var_name = {ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws}_mean,{ra_ws}_sum
new_var_name = ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws
nc_format = ${params:nc_format}
var_name = ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws,{ws_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws}_median,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws}_sum,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_std,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_min,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_max,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_nb,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_q25,{ws_ws,wd_ws,ta_ws,hur_ws,ps_ws,ua_ws,va_ws,psl_ws,huss_ws,Sa_ws,Ca_ws,pr_ws,ra_ws}_q75

