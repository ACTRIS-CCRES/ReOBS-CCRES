ancillary_variables = ta_ws_median, ta_ws_std, ta_ws_min, ta_ws_max, ta_ws_sum, ta_ws_nb, ta_ws_q25, ta_ws_q75
cell_methods = time: mean
coverage_content_type = physicalMeasurement
