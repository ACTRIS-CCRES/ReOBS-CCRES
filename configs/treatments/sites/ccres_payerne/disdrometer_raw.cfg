[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = data_raw,measurement_quality
original_var_name = data_raw
new_var_name = raw_dd
original_dim_name = time,diameter,velocity
new_dim_name = time,diameter,velocity

[check]
technical_vars = measurement_quality
technical_min = 80
technical_max = 100

[treat]
treater = ND
var_computation_on_dim = time,diameter,velocity
var_computation_grid = (${params:time_resolution}),(${params:diameter_resolution}),(${params:velocity_resolution})
var_computation_offset = (${params:time_offset}),(${params:diameter_offset}),(${params:velocity_offset})
var_computation_how = ${params:time_how},${params:diameter_how},${params:velocity_how}
var_mean = {raw_dd}_mean
var_median = {raw_dd}_median
var_sum = {raw_dd}_sum
var_std = {raw_dd}_std
var_min = {raw_dd}_min
var_max = {raw_dd}_max
var_nb = {raw_dd}_nb
var_q25 = {raw_dd}_q25
var_q75 = {raw_dd}_q75
;valid_percent = 0.5

[write]
order_of_dimensions = time,diameter,velocity
original_var_name = {raw_dd}_mean
new_var_name = raw_dd
nc_format = ${params:nc_format}
var_name = raw_dd,{raw_dd}_median,{raw_dd}_sum,{raw_dd}_std,{raw_dd}_min,{raw_dd}_max,{raw_dd}_nb,{raw_dd}_q25,{raw_dd}_q75

[attrs]
title = REOBS CCRES Disdrometer dataset
summary =
keywords =
keywords_vocabulary = GCMD
Conventions = CF-1.10, ACDD-1.3, ISO 8601
naming_authority = AERIS data center
source = surface observation
comment =
acknowledgement =
license = CC BY 4.0
standard_name_vocabulary = CF Standard Name Table v84
creator_name = AERIS data center
creator_type = Data center
creator_url = https://www.aeris-data.fr/
institution = AERIS data center
project = AERIS data center,ReOBS
program = ACTRIS-FR
references = https://doi.org/10.5194/essd-10-919-2018,https://doi.org/10.1002/2014GL060205,https://doi.org/10.1007/s00382-012-1469-y,https://hal.archives-ouvertes.fr/hal-00329353
publisher_name = AERIS data center
publisher_type = Institution
publisher_url = https://www.aeris-data.fr/
processing_level = See ATBD
metadata_link = https://reobs.aeris-data.fr/
contributor_name = AERIS data center,ACTRIS-FR,REOBS,Meteo-France
contributor_role = AERIS is the data center, ACTRIS-FR is a research infrastructure where several algorithms are developed on different French sites, Meteo-France is the French met service to provide meteorological standard data in Paris area, ReOBS is the name of the AERIS project that coordinate the production chain and develop the quality control.
instrument = GCMD: In Situ/Labor

[time]
long_name = Date
standard_name = time
units = ${params:time_units}
calendar = standard
dtype = ${params:time_type}

[diameter]
long_name = Center diameter of precipitation particles
standard_name = diameter
units = m
comment = Predefined diameter classes
dtype = float32

[velocity]
long_name = Center fall velocity of precipitation particles
standard_name = velocity
units = m s-1
comment = Predefined velocity classes
dtype = float32

[raw_dd]
long_name = Raw data
units =
comment = Raw data as a function of particle diameter and velocity
ancillary_variables = raw_dd_median, raw_dd_std, raw_dd_min, raw_dd_max, raw_dd_sum, raw_dd_nb, raw_dd_q25, raw_dd_q75
cell_methods = time:mean,diameter:mean,velocity:mean
dtype = float32
theme = surface_meteorology
