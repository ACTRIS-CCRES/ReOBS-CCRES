[DEFAULT]
dim_time = time
propagate_meta = true

[read]
reader = netcdf
selected_var_name = tb,t_amb,t_rec,t_sta
original_dim_name = time,frequency,receiver_nb
new_dim_name = time,frequency,receiver_nb
original_var_name = tb,t_amb,t_rec,t_sta
new_var_name = tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr

[check]
checked_var_minmax = tb_mwr
min_abs = 2.7
max_abs = 330

[treat]
treater = ND
var_computation_on_dim = time
var_computation_grid = (${params:time_resolution})
var_computation_offset = (${params:time_offset})
var_computation_how = ${params:time_how}
var_mean = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_mean
var_median = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_median
var_sum = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_sum
var_std = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_std
var_min = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_min
var_max = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_max
var_nb = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_nb
var_q25 = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q25
var_q75 = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q75
;valid_percent = 0.5

[write]
order_of_dimensions = time,frequency,receiver_nb
original_var_name = {tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_mean
new_var_name = tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr
nc_format = ${params:nc_format}
var_name = tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_median,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_sum,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_std,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_min,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_max,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_nb,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q25,{tb_mwr,t_amb_mwr,t_rec_mwr,t_sta_mwr}_q75

