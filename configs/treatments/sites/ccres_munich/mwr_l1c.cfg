units = K
comment = Microwave brightness temperature
ancillary_variables = tb_mwr_median, tb_mwr_std, tb_mwr_min, tb_mwr_max, tb_mwr_sum, tb_mwr_nb, tb_mwr_q25, tb_mwr_q75
cell_methods= time:mean
