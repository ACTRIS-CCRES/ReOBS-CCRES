#include "bases_ccres_galati.cfg"

[DEFAULT]
time_division = none
merge_inputs = none
config_file = none
default_config_file = ${ccres_galati:conf_site_dir}/default.cfg

; CLOUDNET
[cloudnet_categorize]
accept=input_not_available
processing_name="Lecture des fichiers cloudnet categorize"
processing_code=${ccres_galati:code_dir}/core/data_stream.py
config_file = ${ccres_galati:conf_site_dir}/categorize.cfg
input=$[base_cloudnet_categorize]
output=$[base_cloudnet_categorize_reobs]
time_division = "1 month"

